name: deep-search-pro

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-deep-search-root-local}
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-deep_search_workbench}
      MYSQL_USER: ${LOCAL_MYSQL_USER:-deepsearch}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-deep-search-local}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${LOCAL_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LOCAL_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_SECRET_KEY:-minioadmin-local}
    ports:
      - "127.0.0.1:${LOCAL_MINIO_API_PORT:-9010}:9000"
      - "127.0.0.1:${LOCAL_MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - silo
        - healthcheck
        - ready
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: ./deep-search-pro-master-be
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./deep-search-pro-master-be/.env
    environment:
      APP_MYSQL_HOST: mysql
      APP_MYSQL_PORT: "3306"
      APP_MYSQL_USER: ${LOCAL_MYSQL_USER:-deepsearch}
      APP_MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-deep-search-local}
      APP_MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-deep_search_workbench}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${LOCAL_MYSQL_USER:-deepsearch}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-deep-search-local}
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-deep_search_workbench}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:${LOCAL_MINIO_API_PORT:-9010}
      MINIO_ACCESS_KEY: ${LOCAL_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${LOCAL_MINIO_SECRET_KEY:-minioadmin-local}
      MINIO_BUCKET: ${LOCAL_MINIO_BUCKET:-deep-search-files}
      MINIO_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:${FRONTEND_PORT:-5173},http://localhost:${FRONTEND_PORT:-5173}
      BACKEND_RELOAD: "false"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-output:/app/output
      - backend-updated:/app/updated
      - backend-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./deep-search-pro-master-fe
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/healthz
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mysql-data:
  minio-data:
  backend-output:
  backend-updated:
  backend-data:
